# Seats. kind = office | crew | fleet. Jurisdictions are concerns, not repos.
# Laid down in the factory shape: an office that works the board at night and
# dispatches a fleet of workers into worktrees of their own; crew who design
# and review by jurisdiction, a record seat and a clerk; an intake office;
# the Censor; a Lictor seat for a cloud routine; the Portcullis on launchd.
#
# example_* seats are placeholders: `curia rename <old> <new>` moves one into
# your naming family (estate.toml `naming_family`) with its directory, then
# write its charter. Offices are keyed by their role; renamed or not, the
# mechanism finds them by `role`, but a second estate with the same office
# names needs --estate from outside a workspace, so a naming family covers
# them too. pronouns are declared by the seat itself; record them here when
# it does.
# tools / disallowed_tools are the authority envelope: disallowed_tools are
# refused in every session (the fence); tools are allowed without asking
# (headless: this list or the default; interactive: only when listed).
# effort = "low" | "medium" | "high" | "xhigh" | "max" is passed to Claude Code
# as --effort: a reviewer pool can run low and an office high.
# active = false parks a seat: launch, run, dispatch and a broadcast mail pass
# it by, status marks it, its memory stays. Each seat costs its wakings; a
# roster shrinks by parking before it shrinks by deleting.

# ---- offices: scheduled, or on demand ---------------------------------------

[seats.example_office]
title = "Example Office"
kind = "office"
model = "claude-opus-5-5"
account = "main"
home = "estate"
pronouns = ""
summary = "Works the board at night: has the crew design what needs design, dispatches the fleet, has the crew review; the one seat that writes beads during a batch. Runs in tmux with --loop."

[seats.censor]
role = "censor"
title = "Censor"
kind = "office"
model = "claude-opus-5-5"
account = "main"
home = "estate"
pronouns = ""
tools = ["Bash", "Read", "Edit", "Write", "Glob", "Grep", "Agent"]
summary = "Woken by `curia censor` (launchd, mornings) only where an integration branch is red: diagnoses, opens draft fix PRs, files a postmortem bead. Never touches a release branch."

[seats.lictor]
role = "lictor"
title = "Lictor"
kind = "office"
model = "claude-sonnet-5"
account = "main"
home = "estate"
pronouns = ""
tools = ["Bash", "Read", "Glob", "Grep"]
summary = "The nudger, read-only. `curia lictor` (launchd, hourly) wakes no model; this seat is for a cloud routine running prompts/lictor-cloud.md when this machine sleeps."

[seats.notarius]
role = "notarius"
title = "Notarius"
kind = "office"
model = "claude-opus-5-5"
account = "main"
home = "estate"
pronouns = ""
summary = "Intake: `curia ingest` wakes it on meeting notes and transcripts; beads filed en masse, questions labelled by person, duplicates caught."

# ---- crew: the principal talks to these; the office wakes them headless ----

[seats.example_crew]
title = "Example Crew"
kind = "crew"
model = "claude-opus-5-5"
fallback_model = "claude-fable-5-1"   # tried on the same account when a headless run dies on a limit
account = "main"
home = "estate"
pronouns = ""
jurisdiction = ["Fill in for this estate: a concern this seat owns, end to end"]
summary = "Designs and reviews within its jurisdiction; the fleet builds."

[seats.example_record]
title = "Example Record"
kind = "crew"
model = "claude-opus-5-5"
fallback_model = "claude-fable-5-1"
account = "main"
home = "estate"
pronouns = ""
jurisdiction = [
  "the record: rulings, postmortems, the brain, every repo's CLAUDE.md",
  "retiring what the week falsified; promoting what recurred",
]
summary = "Keeps the law: turns postmortems into rulings, curates the brain and the repos' CLAUDE.md, retires what is dead."

[seats.example_clerk]
title = "Example Clerk"
kind = "crew"
model = "claude-opus-5-5"
fallback_model = "claude-fable-5-1"
account = "main"
home = "estate"
pronouns = ""
jurisdiction = [
  "documents, decks, correspondence and research on the principal's behalf",
  "questions about the estate and its repos, answered from their own files",
  "whatever is not building software and belongs to no other seat",
]
summary = "The principal's clerk: the seat for everything that is not building software."

# ---- fleet: dispatched by the office, never launched; a worktree each ------

[seats.example_worker_1]
title = "Example Worker 1"
kind = "fleet"
model = "claude-opus-5-5"
account = "main"
managed_by = "example_office"
# active = false   # parked: dispatch passes it by until this is true again
summary = "Fleet worker: one home, one bead at a time, dispatched by its office."

[seats.example_worker_2]
title = "Example Worker 2"
kind = "fleet"
model = "claude-opus-5-5"
account = "main"
managed_by = "example_office"
summary = "Fleet worker: one home, one bead at a time, dispatched by its office."
