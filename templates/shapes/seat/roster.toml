# Seats. kind = office | crew | fleet. Jurisdictions are concerns, not repos.
# Laid down in the seat shape: one crew seat the principal talks to, and
# nothing that runs unattended. Offices and a fleet join when the board is
# worth working without you (README.md, "Growing").
#
# example_crew is a placeholder: `curia rename example_crew <name>` moves it
# into your naming family (estate.toml `naming_family`) with its directory,
# then write its charter. pronouns are declared by the seat itself; record
# them here when it does.
# tools / disallowed_tools are the authority envelope: disallowed_tools are
# refused in every session (the fence); tools are allowed without asking
# (headless: this list or the default; interactive: only when listed).
# effort = "low" | "medium" | "high" | "xhigh" | "max" is passed to Claude Code
# as --effort: a reviewer pool can run low and an office high.
# active = false parks a seat: launch, run, dispatch and a broadcast mail pass
# it by, status marks it, its memory stays. Each seat costs its wakings; a
# roster shrinks by parking before it shrinks by deleting.

[seats.example_crew]
title = "Example Crew"
kind = "crew"
model = "claude-opus-5-5"
# fallback_model = "claude-fable-5-1"   # tried on the same account when a headless run dies on a limit
# tools = ["Bash", "Read", "Edit", "Write", "Glob", "Grep", "Agent"]
# disallowed_tools = ["WebFetch"]
account = "main"
home = "estate"   # or a key from repos.toml; launched from inside a repo, the seat starts there anyway
pronouns = ""
jurisdiction = ["Fill in for this estate: the concern this seat owns, end to end"]
summary = "The seat the principal talks to, and the one that does the work."
