# Repos in the estate. path is relative to the estate root (the parent of curia/).
# forge = github | azure | other. gate/leaf are the commands a seat runs.
# Offices skip a repo with no gate or no integration_branch.

[repos.example]
path = "example"
remote = "https://github.com/ORG/example"
forge = "github"
beads_prefix = ["ex"]
integration_branch = "main"
release_branch = "main"
gate = "just ci"
leaf = "just test"
