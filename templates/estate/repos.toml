# Repos in the estate. path is relative to the estate root (the parent of curia/).
# forge = github | azure | other. gate/leaf are the commands a seat runs.
# Offices skip a repo with no gate or no integration_branch. merge is how the
# Portcullis lands a PR: squash (default), merge or rebase. name_digests is a
# JSON file in the repo whose "digests" are SHA-256 digests of names (lower
# case, every run of other characters one space) that `curia board` must
# never send; named but missing, empty or holding anything else, board
# refuses. `board emit` checks ids against beads_prefix and wants one.

[repos.example]
path = "example"
remote = "https://github.com/ORG/example"
forge = "github"
beads_prefix = ["ex"]
integration_branch = "main"
release_branch = "main"
gate = "just ci"
leaf = "just test"
# merge = "squash"
# name_digests = "names/digests.json"
