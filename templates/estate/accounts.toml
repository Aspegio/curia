# Accounts are Claude config dirs (CLAUDE_CONFIG_DIR). fallback names the next
# account to use when this one is marked limited (`curia limit <name>`) or
# measured past the estate's thresholds. shared = false makes an account a
# dedicated one: only seats whose roster account it is launch there, and no
# other seat's chain falls back to it, so those seats always find it.

[accounts.main]
config_dir = "~/.claude"
plan = ""
purpose = ""
fallback = ""
shared = true
