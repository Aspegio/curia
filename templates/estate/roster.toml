# Seats. kind = office | crew | fleet. Jurisdictions are concerns, not repos.
# Fleet seats carry managed_by and are never launched directly.
# pronouns are declared by the seat itself; record them here when it does.
# tools / disallowed_tools are the authority envelope: disallowed_tools are refused
# in every session (the fence); tools are allowed without asking (headless: this
# list or the default; interactive: only when listed).

[seats.example_office]
title = "Example"
kind = "office"
model = "claude-fable-5-1"
# run_model = "claude-opus-5"   # optional: the model when an office wakes this seat headless (`curia run`)
# fallback_model = "claude-opus-5"   # optional: tried on the same account when a headless run dies on a limit
# tools = ["Bash", "Read", "Edit", "Write", "Glob", "Grep", "Agent"]
# disallowed_tools = ["WebFetch"]
account = "main"
home = "estate"
pronouns = ""
summary = "What this office does, in one line."
active = false

