name = "{{ESTATE}}"
principal = "{{PRINCIPAL}}"
mechanism = "{{MECHANISM}}"
naming_family = "choose one per estate so a seat name is never ambiguous"
created = "{{DATE}}"
# Words the mechanism repo must never contain. The fence test reads these.
denylist = ["{{ESTATE}}", "{{PRINCIPAL}}"]
# How the offices reach you: a shell command run with CURIA_SUBJECT, CURIA_BODY
# and CURIA_REPORT in its environment when the Censor finishes, the Lictor
# writes, a headless run spends its account chain, or a looped seat waits out a
# limit. Empty means nobody is told. macOS:
# notify = 'osascript -e "display notification \"$CURIA_BODY\" with title \"$CURIA_SUBJECT\""'
notify = ""
# Judgment without a waking (`curia recall`, `route`, `triage`, and the lines it
# adds to `ingest`, `lictor` and a handoff's notice): typed questions put to a
# small decision model, which answers with probabilities and writes nothing.
# `jev_key` is a shell command that prints the API key, so no secret lives in
# this file; empty means off, and off changes nothing anywhere. Every call
# sends the text being judged (journal entries, handoffs, notes) to that
# service, and is a line in brain/jev/calls.log. Use a key made for this alone,
# with a spending limit on it: a seat that may run Bash runs as you, and can
# run this command too. CURIA_JEV_KEY in the environment wins over it, and
# CURIA_JEV=off turns judgment off for one command. Notes are never sent
# because this is set: `ingest` and `triage --notes` ask only with --jev. macOS:
# jev_key = 'security find-generic-password -s curia-jev -w'
jev_key = ""
# jev_model and jev_url name another model or endpoint that takes the same
# request; the thresholds (a noul is 0 to 1, a score over three levels 0 to 2)
# are the mechanism's defaults and were judged against its pinned model.
# jev_recall_at = 1.2
# jev_same_at = 1.2
# jev_route_at = 0.6
# jev_needs_at = 0.7
# jev_screen_at = 0.3
# jev_durable_at = 0.6
# `curia board` (judgment on a repo's open beads, as proposals a person
# approves; it never runs bd). A bead carrying one of these labels, or whose
# text holds one of these words (plurals too), is never sent, alone or in a
# pair, and commit lines get the same word screen. The defaults are shown.
# board_exclude_labels = ["security"]
# board_sensitive_words = ["security", "secret", "credential", "password"]
# The heading a bead's description puts its plain summary under, as it stands
# on its line (unset: no summary flag), and labels besides human_labels that
# say a bead waits on someone.
# board_summary_heading = "## Summary"
# board_waiting_labels = []
# Where the estate's notes live (a vault, a folder of markdown), for
# `curia triage --notes --jev`, which reads it and moves nothing. Unset: no notes triage.
# notes = "~/notes"
# Where fleet workers' homes go (`curia dispatch`): a directory relative to the
# estate root, one worktree per seat per repo underneath it.
worktrees = "worktrees"
# Reaping (`curia reap`, and the end of every launched session of a seat with
# reap_after = true in the roster): a scratch worktree (<repo>/.claude/worktrees/)
# touched within reap_quiet_hours is left alone (default 1). With
# reap_stale_days set, a clean, unlanded scratch worktree with no open PR and
# untouched that long is removed too, its branch kept. Unset: only landed ones go.
# reap_stale_days = 30
# `check` notes a seat whose prime (charter, handoff, laurels, mail, house rules,
# the tables) is over this many KB: standing text a seat can read on demand
# costs less in a file than read at every waking (default 32).
# prime_max_kb = 32
# What a reviewer adds to a PR to say "land this" when it cannot approve (same
# forge identity as the worker); an APPROVED review counts too. The Portcullis
# lands PRs that carry it and are green.
land_label = "reviewed"
# Rotation. Percent of an account's fullest rate-limit window, as the seat's
# status line last measured it (five-hour, seven-day, or a spend limit):
# rotate_at - a launch prefers the next account in the chain past this;
# handoff_at - the Stop hook tells a seat to hand off past this;
# limited_at - a launch treats the account as limited past this, marker or none.
# shift_hours - the Stop hook tells a seat to hand off after this long awake
# (0: never); wrap_minutes - how long before --until to start wrapping up
# (0: no margin); budget_wrap_at - percent of --budget at which to start
# wrapping up; context_at - the Stop hook tells a seat to hand off once its
# context window is this full (percent; a long context costs more every turn
# and hands off worse; 0: never). These are the mechanism's defaults; change
# them here.
rotate_at = 70
# rotate_week_at - the same on the seven-day and spend windows, which empty slowly
rotate_week_at = 90
handoff_at = 85
limited_at = 95
shift_hours = 6
wrap_minutes = 45
budget_wrap_at = 90
context_at = 60
# `check` notes hooks.json declaring more fences than this. Fences are distrust
# written down; past a point no work is legal. The Lictor says which are idle
# and which are busy (brain/fences.log); the principal decides what stays.
# fences_max = 20
# Labels that say a bead waits on a person. `launch --everything` leaves those
# beads alone and stops when nothing else remains.
human_labels = ["needs-principal", "needs-human", "blocked-by-human"]
